<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aidnd testing table</title>
<style>
:root {
  --bg: #15171c; --panel: #1e2128; --panel2: #262a33; --line: #343946; --text: #e6e6e6; --muted: #9aa0ad;
  --gold: #e8b74a; --blue: #5b9cf0; --red: #e0605a; --grey: #8d939e; --green: #5fbf7f; --accent: #a58cf0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; } button:hover { border-color: var(--accent); } button:disabled { opacity: .4; cursor: default; }
header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 8px 0 0; }
header .grow { flex: 1; min-width: 160px; }
#status { color: var(--muted); }
#grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; padding: 8px; height: calc(100% - 50px); }
@media (max-width: 900px) { #grid { grid-template-columns: 1fr; grid-template-rows: none; height: auto; } .seat { height: 80vh; } }
.seat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.seat.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(232,183,74,.35), 0 0 18px rgba(232,183,74,.25); }
.seat .top { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seat .who { font-weight: 600; }
.seat .tabs { display: flex; gap: 2px; margin-left: auto; }
.seat .tabs button { padding: 2px 8px; border-radius: 4px; }
.seat .tabs button.on { border-color: var(--gold); color: var(--gold); }
.body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.mapwrap { border-bottom: 1px solid var(--line); max-height: 40%; overflow: auto; flex-shrink: 0; }
.mapwrap.closed svg { display: none; }
.mapwrap .maphead { display: flex; justify-content: space-between; padding: 2px 8px; color: var(--muted); cursor: pointer; font-size: 12px; }
.pane { flex: 1; overflow: auto; padding: 8px; min-height: 0; }
.feed .ev { margin: 0 0 8px; }
.feed .narr { background: var(--panel2); border-radius: 8px; padding: 6px 8px; }
.feed .narr.quick { border-left: 3px solid var(--accent); }
.feed .act { color: var(--gold); }
.feed .roll { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
.tier-critical_success, .tier-success { color: var(--green); }
.tier-failure, .tier-critical_failure { color: var(--red); }
.feed .chg { font-size: 12px; color: #c9d2e0; }
.feed .chg::before { content: "• "; color: var(--muted); }
.feed .sys { font-size: 12px; color: var(--muted); font-style: italic; }
.feed .err { font-size: 12px; color: var(--red); }
.bar { display: flex; gap: 6px; padding: 6px 8px; border-top: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.bar input { flex: 1; min-width: 120px; }
.chip { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.chip.on { color: var(--green); border-color: var(--green); }
.chip.off { text-decoration: line-through; }
.setup { padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.setup .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.setup label { color: var(--muted); }
.scores { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.scores div { display: flex; flex-direction: column; align-items: center; }
table.kv { border-collapse: collapse; width: 100%; } table.kv td { padding: 2px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
h3 { margin: 8px 0 4px; font-size: 13px; color: var(--gold); }
.muted { color: var(--muted); }
.hp { display: inline-block; width: 60px; height: 6px; background: #432; border-radius: 3px; vertical-align: middle; }
.hp i { display: block; height: 100%; background: var(--red); border-radius: 3px; }
svg text { fill: var(--text); font-size: 11px; pointer-events: none; }
svg .zone { fill: var(--panel2); stroke: var(--line); stroke-width: 1.5; cursor: pointer; }
svg .zone.mine { stroke: var(--gold); stroke-width: 2.5; }
svg .zone.reach { stroke-dasharray: 5 3; stroke: var(--accent); }
svg .link { stroke: var(--line); stroke-width: 2; }
svg .tok { cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>aidnd · testing table</h1>
  <select id="camp"></select>
  <button id="refresh" title="Reload campaign list">↻</button>
  <input id="premise" class="grow" placeholder="Premise for a new campaign (e.g. a haunted lake town)">
  <button id="create">New campaign</button>
  <button id="auto">Auto-setup</button>
  <button id="start">Start</button>
  <span id="status"></span>
</header>
<div id="grid"></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ABIL = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];
const ARRAY = [15, 14, 13, 12, 10, 8];
const KITS = ["warrior", "skirmisher", "ranger", "arcanist", "devout", "bard"];
const CONCEPTS = ["a scarred mercenary who owes everyone money", "a cheerful knife-thrower from the docks", "a quiet hunter who reads tracks like books", "a nervous scholar of forbidden bells"];
let campaignId = "";
const status = t => { $("#status").textContent = t; };

async function api(method, path, body, player) {
  const h = { "Content-Type": "application/json" };
  if (player) h["X-Player-ID"] = player;
  const r = await fetch(path, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await r.json(); } catch {}
  if (!r.ok) {
    const msg = (data && (data.problems ? data.error + ": " + data.problems.join("; ") : data.error)) || r.statusText;
    throw new Error(msg);
  }
  return data;
}

class Seat {
  constructor(n) {
    this.n = n; this.pid = "dev-seat-" + n; this.tab = "story"; this.view = null; this.es = null; this.hint = {};
    this.mapOpen = true; this.lastId = 0;
    this.el = document.createElement("div");
    this.el.className = "seat";
    $("#grid").appendChild(this.el);
    this.render();
  }
  me() { return this.view?.you?.character_id ? this.view.party.find(c => c.id === this.view.you.character_id) : null; }
  joined() { return !!this.view?.you?.joined; }
  render() {
    const v = this.view, me = this.me();
    const started = v && v.status !== "lobby";
    this.el.classList.toggle("active", !!v?.you?.your_turn);
    this.el.innerHTML = `
      <div class="top">
        <span class="who">Seat ${this.n}${me ? " · " + esc(me.name) : ""}</span>
        <span class="muted">${me ? `${esc(me.class)} L${me.level} · HP ${me.hp}/${me.max_hp} · AC ${me.ac} · ${me.gold}g` : esc(this.pid)}</span>
        ${started ? `<div class="tabs">${["story", "sheet", "world", "journal"].map(t => `<button data-tab="${t}" class="${t === this.tab ? "on" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div>` : ""}
      </div>
      <div class="body">${started ? this.playBody() : this.setupBody()}</div>
      ${started ? this.inputBar() : ""}`;
    this.el.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { this.tab = b.dataset.tab; this.render(); });
    if (!started) return this.wireSetup();
    this.wirePlay();
  }
  setupBody() {
    const v = this.view;
    if (!campaignId) return `<div class="setup muted">Create or pick a campaign above.</div>`;
    if (!this.joined()) return `<div class="setup"><div class="row"><input id="name" value="Player ${this.n}"><button id="join">Join</button></div></div>`;
    const me = this.me();
    const d = this.draft || {};
    return `<div class="setup">
      <div class="row">${me ? `<b>${esc(me.name)}</b> <span class="muted">${esc(me.class)} (${esc(me.kit)}) is ready.</span>` : `<span class="muted">No character yet.</span>`}</div>
      <div class="row"><input id="concept" class="grow" style="flex:1" placeholder="Concept" value="${esc(d.concept || CONCEPTS[this.n - 1])}">
        <button id="draft">Draft &amp; edit</button><button id="quick">Quick create</button></div>
      ${this.draft ? this.draftForm() : ""}
      <div class="feed" id="sfeed"></div>
    </div>`;
  }
  draftForm() {
    const d = this.draft;
    return `<div class="row"><label>Name</label><input id="d-name" value="${esc(d.name)}"><label>Class</label><input id="d-class" value="${esc(d.class || "")}">
      <label>Pronouns</label><input id="d-pron" size="9" value="${esc(d.pronouns || "they/them")}">
      <label>Kit</label><select id="d-kit">${KITS.map(k => `<option ${k === d.kit ? "selected" : ""}>${k}</option>`).join("")}</select></div>
      <div class="scores">${ABIL.map(a => `<div><label>${a}</label><select data-ab="${a}">${ARRAY.map(x => `<option ${d.scores?.[a] === x ? "selected" : ""}>${x}</option>`).join("")}</select>
        <label><input type="checkbox" data-prof="${a}" ${(d.proficient || []).includes(a) ? "checked" : ""}> prof</label></div>`).join("")}</div>
      <textarea id="d-back" rows="2" placeholder="Backstory">${esc(d.backstory || "")}</textarea>
      <div class="row"><button id="save">Save character</button><span class="err" id="derr"></span></div>`;
  }
  wireSetup() {
    const q = s => $(s, this.el);
    q("#join") && (q("#join").onclick = () => this.run(async () => {
      await api("POST", `/campaigns/${campaignId}/players`, { name: q("#name").value }, this.pid);
      await this.refresh(); this.connect();
    }));
    q("#draft") && (q("#draft").onclick = () => this.run(async () => {
      status(`Seat ${this.n}: drafting…`);
      const r = await api("POST", `/campaigns/${campaignId}/characters/draft`, { concept: q("#concept").value }, this.pid);
      this.draft = { ...r.character, concept: q("#concept").value }; this.render(); status("");
    }));
    q("#quick") && (q("#quick").onclick = () => this.run(async () => {
      status(`Seat ${this.n}: creating…`);
      await api("POST", `/campaigns/${campaignId}/characters`, { concept: q("#concept").value }, this.pid);
      this.draft = null; await this.refresh(); status("");
    }));
    q("#save") && (q("#save").onclick = () => this.run(async () => {
      const scores = {}; this.el.querySelectorAll("[data-ab]").forEach(s => scores[s.dataset.ab] = +s.value);
      const proficient = [...this.el.querySelectorAll("[data-prof]:checked")].map(c => c.dataset.prof);
      const character = { name: q("#d-name").value, class: q("#d-class").value, kit: q("#d-kit").value, scores, proficient, backstory: q("#d-back").value, pronouns: q("#d-pron").value, concept: this.draft.concept };
      try { await api("POST", `/campaigns/${campaignId}/characters`, { character }, this.pid); this.draft = null; await this.refresh(); }
      catch (e) { q("#derr").textContent = e.message; }
    }));
    this.renderFeed($("#sfeed", this.el));
  }
  playBody() {
    let pane = "";
    if (this.tab === "story") pane = `<div class="feed" id="feed"></div>`;
    if (this.tab === "sheet") pane = this.sheetHTML();
    if (this.tab === "world") pane = this.worldHTML();
    if (this.tab === "journal") pane = `<div id="journal" class="muted">Loading…</div>`;
    const map = this.view.location?.zones?.length ? `<div class="mapwrap ${this.mapOpen ? "" : "closed"}"><div class="maphead"><span>${esc(this.view.location.name)}${this.view.encounter ? " · ⚔ round " + this.view.encounter.round : ""}</span><span>${this.mapOpen ? "▾ map" : "▸ map"}</span></div>${this.mapSVG()}</div>` : "";
    return map + `<div class="pane">${pane}</div>`;
  }
  inputBar() {
    const v = this.view, b = v.budget, mine = v.you?.your_turn;
    const chip = (label, n) => `<span class="chip ${n !== 0 ? "on" : "off"}">${label} ${n === -1 ? "∞" : n}</span>`;
    const ended = v.status === "completed" || v.status === "failed";
    return `<div class="bar">
      ${b && mine ? chip("action", b.action) + chip("move", b.move) + chip("free", b.free) : `<span class="muted">${ended ? "Campaign " + v.status : v.active ? esc(v.active.name) + "'s turn" : ""}</span>`}
      <input id="say" placeholder="${mine ? "What do you do?" : "Waiting…"}" ${mine ? "" : "disabled"} value="${esc(this.pending || "")}">
      <button id="send" ${mine ? "" : "disabled"}>Send</button>
      <button id="end" ${mine ? "" : "disabled"}>End turn</button></div>`;
  }
  wirePlay() {
    const q = s => $(s, this.el);
    const say = q("#say");
    const send = () => {
      const text = say.value.trim(); if (!text) return;
      const hint = this.hint; this.hint = {}; this.pending = "";
      say.value = ""; say.disabled = true;
      this.run(async () => {
        status(`Seat ${this.n}: resolving…`);
        await api("POST", `/campaigns/${campaignId}/actions`, { text, ...hint }, this.pid);
        status("");
      });
    };
    q("#send") && (q("#send").onclick = send);
    say && (say.onkeydown = e => { if (e.key === "Enter") send(); }, say.oninput = () => { this.pending = say.value; });
    q("#end") && (q("#end").onclick = () => this.run(() => api("POST", `/campaigns/${campaignId}/skip`, {}, this.pid)));
    q(".maphead") && (q(".maphead").onclick = () => { this.mapOpen = !this.mapOpen; this.render(); });
    this.el.querySelectorAll("[data-click]").forEach(el => el.onclick = ev => {
      ev.stopPropagation();
      const [kind, id, name] = el.dataset.click.split("|");
      if (kind === "enemy") { this.pending = `I attack ${name}`; this.hint = { target_id: id }; }
      if (kind === "npc") { this.pending = `I talk to ${name}: `; this.hint = { target_id: id }; }
      if (kind === "zone") { this.pending = `I move to ${name}`; this.hint = { zone_id: id }; }
      if (kind === "ally") { this.pending = `I help ${name}`; this.hint = { target_id: id }; }
      this.render(); const s = $("#say", this.el); if (s && !s.disabled) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    });
    if (this.tab === "story") this.renderFeed(q("#feed"));
    if (this.tab === "journal") this.loadJournal();
  }
  mapSVG() {
    const loc = this.view.location, zones = loc.zones, me = this.me();
    const byId = Object.fromEntries(zones.map(z => [z.id, z]));
    const root = me?.zone_id && byId[me.zone_id] ? me.zone_id : zones[0].id;
    const dist = { [root]: 0 }, order = [root];
    for (let i = 0; i < order.length; i++) for (const a of byId[order[i]].adjacent) if (!(a in dist) && byId[a]) { dist[a] = dist[order[i]] + 1; order.push(a); }
    zones.forEach(z => { if (!(z.id in dist)) { dist[z.id] = 0; order.push(z.id); } });
    const cols = {}; order.forEach(id => (cols[dist[id]] ||= []).push(id));
    const W = 150, H = 74, GX = 40, GY = 14, pos = {};
    let maxRows = 1;
    Object.entries(cols).forEach(([c, ids]) => { maxRows = Math.max(maxRows, ids.length); ids.forEach((id, r) => pos[id] = { x: 10 + c * (W + GX), y: 10 + r * (H + GY) }); });
    const width = 20 + Object.keys(cols).length * (W + GX) - GX, height = 20 + maxRows * (H + GY) - GY;
    let s = `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px;display:block">`;
    zones.forEach(z => z.adjacent.forEach(a => { if (a > z.id && pos[a]) s += `<line class="link" x1="${pos[z.id].x + W / 2}" y1="${pos[z.id].y + H / 2}" x2="${pos[a].x + W / 2}" y2="${pos[a].y + H / 2}"/>`; }));
    const tokens = {};
    const add = (zid, t) => (tokens[zid] ||= []).push(t);
    this.view.party.forEach(c => add(c.zone_id, { kind: c.id === me?.id ? "me" : "ally", id: c.id, name: c.name, down: c.down }));
    (loc.npcs || []).forEach(n => add(n.zone_id, { kind: "npc", id: n.id, name: n.name }));
    (this.view.encounter?.enemies || []).forEach(e => add(e.zone_id, { kind: "enemy", id: e.id, name: e.display, hp: e.hp, max: e.max_hp }));
    zones.forEach(z => {
      const p = pos[z.id], d = dist[z.id];
      const cls = "zone" + (z.id === me?.zone_id ? " mine" : d === 1 ? " reach" : "");
      s += `<g data-click="zone|${z.id}|${esc(z.name)}"><rect class="${cls}" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8"/></g>`;
      s += `<text x="${p.x + 6}" y="${p.y + 14}">${esc(z.name)}${z.cover ? " 🛡" : ""}${z.exits.length ? " ⇢" + z.exits.length : ""}</text>`;
      (tokens[z.id] || []).forEach((t, i) => {
        const tx = p.x + 14 + (i % 6) * 22, ty = p.y + 34 + Math.floor(i / 6) * 24;
        const fill = { me: "var(--gold)", ally: "var(--blue)", npc: "var(--grey)", enemy: "var(--red)" }[t.kind];
        s += `<g class="tok" data-click="${t.kind === "me" ? "ally" : t.kind}|${t.id}|${esc(t.name)}"><title>${esc(t.name)}</title><circle cx="${tx}" cy="${ty}" r="9" fill="${fill}" opacity="${t.down ? .35 : 1}"/>`;
        s += `<text x="${tx}" y="${ty + 4}" text-anchor="middle" style="fill:#111;font-weight:700">${esc(t.name[0])}</text>`;
        if (t.kind === "enemy") s += `<rect x="${tx - 9}" y="${ty + 11}" width="18" height="3" fill="#432"/><rect x="${tx - 9}" y="${ty + 11}" width="${18 * Math.max(0, t.hp) / t.max}" height="3" fill="var(--red)"/>`;
        s += `</g>`;
      });
    });
    return s + "</svg>";
  }
  sheetHTML() {
    const c = this.me(); if (!c) return "";
    return `<table class="kv">
      <tr><td>Name</td><td>${esc(c.name)} (${esc(c.pronouns || "they/them")}) · ${esc(c.class)} (${esc(c.kit)}) · Level ${c.level} · XP ${c.xp}${c.next_level_xp ? "/" + c.next_level_xp : ""}</td></tr>
      <tr><td>HP / AC</td><td>${c.hp}/${c.max_hp}${c.down ? " (DOWN)" : ""} · AC ${c.ac} · proficiency +${c.proficiency_bonus}</td></tr>
      <tr><td>Gold</td><td>${c.gold}</td></tr>
      <tr><td>Abilities</td><td>${ABIL.map(a => `${a} ${c.scores[a]} (${c.modifiers[a] >= 0 ? "+" : ""}${c.modifiers[a]}${c.proficient.includes(a) ? "★" : ""})`).join(" · ")}</td></tr>
      <tr><td>Weapon</td><td>${esc(c.weapon?.name)} ${esc(c.weapon?.damage)} · ${esc(c.weapon?.reach)}</td></tr>
      <tr><td>Inventory</td><td>${c.inventory.map(i => `${esc(i.name)}${i.equipped ? " (equipped)" : ""}${i.effect ? " · " + esc(i.effect) : ""}`).join("<br>")}</td></tr>
      ${c.backstory ? `<tr><td>Backstory</td><td>${esc(c.backstory)}</td></tr>` : ""}</table>`;
  }
  worldHTML() {
    const v = this.view, l = v.location;
    const zname = id => l.zones?.find(z => z.id === id)?.name || "";
    return `<h3>${esc(l.name)} <span class="muted">${esc(l.kind)} · danger ${l.danger} · day ${v.scene.day} ${esc(v.scene.time)} · tension ${v.scene.tension}</span></h3>
      <div>${esc(l.description)}</div>
      <h3>Exits</h3>${(l.exits || []).map(x => `<div>⇢ ${esc(x.label)} → <b>${esc(x.to_name)}</b> <span class="muted">(${x.state}${x.explored ? "" : ", unexplored"}, from ${esc(zname(x.zone_id))})</span></div>`).join("") || "<div class='muted'>none</div>"}
      <h3>Zones</h3>${(l.zones || []).map(z => `<div>${esc(z.name)}${z.cover ? " 🛡" : ""} <span class="muted">— ${esc(z.desc)}</span></div>`).join("")}
      <h3>People</h3>${(l.npcs || []).map(n => `<div>${esc(n.name)} <span class="muted">${esc(n.role)}${n.merchant ? " · merchant" : ""} · attitude ${n.disposition} · ${esc(zname(n.zone_id))}</span></div>`).join("") || "<div class='muted'>nobody</div>"}
      ${v.encounter ? `<h3>Enemies (round ${v.encounter.round})</h3>${v.encounter.enemies.map(e => `<div>${esc(e.display)} <span class="hp"><i style="width:${100 * e.hp / e.max_hp}%"></i></span> ${e.hp}/${e.max_hp} <span class="muted">${e.ranged ? "ranged · " : ""}${esc(zname(e.zone_id))}</span></div>`).join("")}` : ""}
      ${(l.items || []).length ? `<h3>On the ground</h3>${l.items.map(i => `<div>${esc(i.name)}</div>`).join("")}` : ""}
      <h3>Party</h3>${v.party.map(c => `<div>${esc(c.name)} <span class="muted">HP ${c.hp}/${c.max_hp} · ${esc(zname(c.zone_id))}${v.active?.character_id === c.id ? " · acting" : ""}</span></div>`).join("")}
      <h3>Quests</h3>${v.quests.map(q => `<div><b>${esc(q.title)}</b> <span class="muted">${q.status}${q.giver_name ? " · " + esc(q.giver_name) : ""}${q.reward_gold ? " · " + q.reward_gold + "g" : ""}</span>${q.objectives.map(o => `<div class="muted">${o.done ? "☑" : "☐"} ${esc(o.text)}</div>`).join("")}</div>`).join("")}`;
  }
  async loadJournal() {
    try {
      const j = await api("GET", `/campaigns/${campaignId}/journal`, null, this.pid);
      const el = $("#journal", this.el); if (!el) return;
      el.className = "";
      el.innerHTML = `${j.summary ? `<h3>Story so far</h3><div>${esc(j.summary)}</div>` : ""}<h3>Chronicle</h3>${j.chronicle.map(c => `<div>• ${esc(c.text)} <span class="muted">(turn ${c.turn})</span></div>`).join("") || "<div class='muted'>Nothing recorded yet.</div>"}
        <h3>Setbacks</h3><div>${j.setbacks}</div>`;
    } catch (e) { status(e.message); }
  }
  // --- events
  connect() {
    if (this.es || !campaignId) return;
    this.events = [];
    this.es = new EventSource(`/campaigns/${campaignId}/events`);
    this.es.onmessage = () => {};
    const types = ["campaign_created", "player_joined", "character_created", "player_action", "action_resolved", "narration", "enemy_turns", "quest_updated", "location_changed", "turn_started", "turn_budget", "campaign_ended"];
    types.forEach(t => this.es.addEventListener(t, ev => this.onEvent(JSON.parse(ev.data))));
  }
  disconnect() { this.es?.close(); this.es = null; this.events = []; }
  onEvent(e) {
    if (e.id <= this.lastId) return;
    this.lastId = e.id;
    this.events.push(e);
    const feed = $("#feed", this.el) || $("#sfeed", this.el);
    if (feed) { feed.insertAdjacentHTML("beforeend", this.eventHTML(e)); feed.parentElement.scrollTop = 1e9; }
    clearTimeout(this.rt); this.rt = setTimeout(() => this.refresh(), 150);
  }
  renderFeed(el) {
    if (!el) return;
    el.innerHTML = (this.events || []).map(e => this.eventHTML(e)).join("");
    requestAnimationFrame(() => { el.parentElement.scrollTop = 1e9; });
  }
  eventHTML(e) {
    const d = e.data || {};
    switch (e.type) {
      case "player_action": return `<div class="ev act">▶ <b>${esc(d.character)}</b>: ${esc(d.text)}</div>`;
      case "action_resolved": {
        let h = "";
        (d.steps || []).forEach(s => {
          if (s.error) h += `<div class="err">✗ ${esc(s.action.kind)}: ${esc(s.error)}</div>`;
          (s.rolls || []).forEach(r => h += `<div class="roll">🎲 ${esc(r.label)}: ${r.kind === "damage" || r.kind === "heal" ? `${esc(r.expr)} [${(r.dice || []).join(",")}] = ${r.total}` : r.kind === "encounter" ? `d100 ${r.total} (≤${r.target})` : `d20 ${r.natural}${r.mod >= 0 ? "+" : ""}${r.mod} = ${r.total} vs ${r.target} <span class="tier-${r.tier}">${esc((r.tier || "").replace("_", " "))}</span>`}</div>`);
          (s.changes || []).forEach(c => h += `<div class="chg">${esc(c)}</div>`);
        });
        (d.skipped || []).forEach(s => h += `<div class="err">⤼ skipped ${esc(s.action.kind)}: ${esc(s.error)}</div>`);
        (d.world_changes || []).forEach(c => h += `<div class="chg">✦ ${esc(c)}</div>`);
        return `<div class="ev">${h}</div>`;
      }
      case "narration": return `<div class="ev narr ${d.quick ? "quick" : ""}">${esc(d.text)}</div>`;
      case "enemy_turns": {
        let h = (d.turns || []).map(t => {
          const a = t.attack; if (!a) return `<div class="chg">${esc(t.text)}</div>`;
          const r = a.roll;
          return `<div class="roll">🎲 ${esc(r.label)}: d20 ${r.natural}${r.mod >= 0 ? "+" : ""}${r.mod} = ${r.total} vs AC ${r.target} <span class="tier-${r.tier}">${esc(r.tier.replace("_", " "))}</span>${a.damage ? ` · ${a.damage.total} dmg` : ""}</div>`;
        }).join("");
        return `<div class="ev">${h}<div class="narr">${esc(d.narration)}</div></div>`;
      }
      case "quest_updated": return `<div class="ev sys">📜 ${esc(d.text)}</div>`;
      case "location_changed": return `<div class="ev sys">📍 ${esc(d.name)}</div>`;
      case "turn_started": return `<div class="ev sys">— ${esc(d.name)}'s turn —</div>`;
      case "player_joined": return `<div class="ev sys">${esc(d.name)} joined</div>`;
      case "character_created": return `<div class="ev sys">${esc(d.name)} the ${esc(d.class)} is ready</div>`;
      case "campaign_created": return `<div class="ev sys">Campaign: ${esc(d.title)}</div>`;
      case "campaign_ended": return `<div class="ev narr">The campaign has ${d.status === "completed" ? "been won" : "failed"}.</div>`;
      default: return "";
    }
  }
  async refresh() {
    if (!campaignId) { this.view = null; return this.render(); }
    try { this.view = await api("GET", `/campaigns/${campaignId}`, null, this.pid); }
    catch (e) { status(e.message); }
    if (this.joined()) this.connect();
    const focus = document.activeElement && this.el.contains(document.activeElement) ? document.activeElement.id : null;
    this.render();
    if (focus) { const f = $("#" + focus, this.el); if (f && !f.disabled) f.focus(); }
  }
  async run(fn) {
    try { await fn(); } catch (e) { status(`Seat ${this.n}: ${e.message}`); await this.refresh(); }
  }
}

const seats = [1, 2, 3, 4].map(n => new Seat(n));

async function loadCampaigns(select) {
  const r = await api("GET", "/campaigns");
  const sel = $("#camp");
  sel.innerHTML = `<option value="">— pick a campaign —</option>` + r.campaigns.map(c => `<option value="${c.id}">${esc(c.title)} (${c.status}, ${c.players}/${c.max_players})</option>`).join("");
  if (select) sel.value = select;
  else if (campaignId) sel.value = campaignId;
}
async function useCampaign(id) {
  campaignId = id;
  try { localStorage.setItem("aidnd-campaign", id); } catch {}
  seats.forEach(s => { s.disconnect(); s.lastId = 0; s.draft = null; });
  await Promise.all(seats.map(s => s.refresh()));
}
$("#camp").onchange = e => useCampaign(e.target.value);
$("#refresh").onclick = () => loadCampaigns();
$("#create").onclick = async () => {
  status("Creating campaign (this can take a minute)…");
  try {
    const c = await api("POST", "/campaigns", { premise: $("#premise").value });
    await loadCampaigns(c.id); await useCampaign(c.id); status(`Created “${c.title}”`);
  } catch (e) { status(e.message); }
};
$("#start").onclick = async () => {
  if (!campaignId) return;
  status("Starting…");
  try { await api("POST", `/campaigns/${campaignId}/start`, null, seats[0].pid); status(""); await Promise.all(seats.map(s => s.refresh())); loadCampaigns(); }
  catch (e) { status(e.message); }
};
$("#auto").onclick = async () => {
  try {
    if (!campaignId) {
      status("Creating campaign…");
      const c = await api("POST", "/campaigns", { premise: $("#premise").value });
      await loadCampaigns(c.id); await useCampaign(c.id);
    }
    status("Joining four seats…");
    for (const s of seats) await api("POST", `/campaigns/${campaignId}/players`, { name: "Player " + s.n }, s.pid);
    status("Creating characters in parallel…");
    await Promise.all(seats.map(async s => {
      await s.refresh();
      if (!s.me()) await api("POST", `/campaigns/${campaignId}/characters`, { concept: CONCEPTS[s.n - 1] }, s.pid);
    }));
    status("Starting…");
    await api("POST", `/campaigns/${campaignId}/start`, null, seats[0].pid);
    await Promise.all(seats.map(s => s.refresh())); loadCampaigns(); status("Ready.");
  } catch (e) { status(e.message); }
};
(async () => {
  let saved = ""; try { saved = localStorage.getItem("aidnd-campaign") || ""; } catch {}
  try { await loadCampaigns(saved); } catch (e) { status(e.message); }
  if (saved && $("#camp").value === saved) useCampaign(saved);
})();
</script>
