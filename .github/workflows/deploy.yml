# Tests, then deploys the Worker, UI and game container to Cloudflare.
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, APP_SECRET,
# PLAY_CODE, LLM_API_KEY.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      # Skips cleanly until the Cloudflare secrets are added.
      - id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."; fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - if: steps.ready.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            APP_SECRET
            PLAY_CODE
            LLM_API_KEY
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          PLAY_CODE: ${{ secrets.PLAY_CODE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
